<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="480" height="250">

  <!-- Background -->
  <rect width="480" height="250" fill="#FFFFFF"/>

  <!-- ── WHEELS ── -->
  <circle cx="138" cy="120" r="50" fill="none" stroke="#111111" stroke-width="3.2"/>
  <circle cx="342" cy="120" r="50" fill="none" stroke="#111111" stroke-width="3.2"/>

  <!-- Hubs -->
  <circle cx="138" cy="120" r="3.5" fill="#111111"/>
  <circle cx="342" cy="120" r="3.5" fill="#111111"/>

  <!-- Bottom bracket -->
  <circle cx="225" cy="120" r="3.5" fill="#111111"/>

  <!-- ── FRAME ── -->
  <!-- Chain stay -->
  <line x1="138" y1="120" x2="225" y2="120"
        stroke="#111111" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Seat tube -->
  <line x1="225" y1="120" x2="208" y2="56"
        stroke="#111111" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Top tube -->
  <line x1="208" y1="56" x2="300" y2="52"
        stroke="#111111" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Down tube -->
  <line x1="225" y1="120" x2="304" y2="68"
        stroke="#111111" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Seat stay -->
  <line x1="138" y1="120" x2="208" y2="56"
        stroke="#111111" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Fork -->
  <line x1="304" y1="68" x2="342" y2="120"
        stroke="#111111" stroke-width="3.2" stroke-linecap="round"/>

  <!-- ── SEAT POST & SADDLE ── -->
  <line x1="208" y1="56" x2="205" y2="39"
        stroke="#111111" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Saddle: gentle ergonomic curve -->
  <path d="M 191,37 Q 205,31 219,37"
        fill="none" stroke="#111111" stroke-width="2.8" stroke-linecap="round"/>

  <!-- ── DROP HANDLEBARS ── -->
  <!-- Stem: rises from head tube top -->
  <line x1="300" y1="52" x2="302" y2="35"
        stroke="#111111" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Drop bar: hoods extend rearward then drop curves down -->
  <!-- Classic D-profile drop bar from side view -->
  <path d="M 302,35 L 282,35 Q 271,35 271,47 Q 271,59 282,59 L 288,59"
        fill="none" stroke="#111111" stroke-width="2.8"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── TYPOGRAPHY ── -->
  <!-- Brand name -->
  <text x="240" y="203"
        font-family="'Helvetica Neue', Arial, Helvetica, sans-serif"
        font-size="32"
        font-weight="700"
        letter-spacing="9"
        text-anchor="middle"
        fill="#111111">DR. BIKE</text>

  <!-- Divider line -->
  <line x1="152" y1="212" x2="328" y2="212"
        stroke="#111111" stroke-width="0.8" opacity="0.6"/>

  <!-- Subtitle -->
  <text x="240" y="229"
        font-family="'Helvetica Neue', Arial, Helvetica, sans-serif"
        font-size="9.5"
        font-weight="400"
        letter-spacing="3.8"
        text-anchor="middle"
        fill="#111111">PREMIUM BICYCLE MECHANIC</text>

</svg>
