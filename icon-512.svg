<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#1848C8"/>
  
  <!-- Rear wheel -->
  <circle cx="155" cy="330" r="95" fill="none" stroke="white" stroke-width="30"/>
  <circle cx="155" cy="330" r="12" fill="white"/>
  
  <!-- Front wheel -->
  <circle cx="357" cy="330" r="95" fill="none" stroke="white" stroke-width="30"/>
  <circle cx="357" cy="330" r="12" fill="white"/>
  
  <!-- Frame - chainstay -->
  <line x1="155" y1="330" x2="256" y2="240" stroke="white" stroke-width="26" stroke-linecap="round"/>
  
  <!-- Frame - seat tube -->
  <line x1="256" y1="240" x2="230" y2="330" stroke="white" stroke-width="26" stroke-linecap="round"/>
  <line x1="230" y1="330" x2="155" y2="330" stroke="white" stroke-width="20" stroke-linecap="round"/>
  
  <!-- Frame - top tube + down tube -->
  <line x1="256" y1="240" x2="310" y2="160" stroke="white" stroke-width="26" stroke-linecap="round"/>
  <line x1="310" y1="160" x2="357" y2="330" stroke="white" stroke-width="26" stroke-linecap="round"/>
  
  <!-- Fork -->
  <line x1="310" y1="160" x2="357" y2="330" stroke="white" stroke-width="26" stroke-linecap="round"/>
  
  <!-- Handlebar -->
  <line x1="296" y1="155" x2="330" y2="155" stroke="white" stroke-width="24" stroke-linecap="round"/>
  <line x1="296" y1="145" x2="296" y2="170" stroke="white" stroke-width="24" stroke-linecap="round"/>
  
  <!-- Seat post -->
  <line x1="248" y1="230" x2="248" y2="190" stroke="white" stroke-width="22" stroke-linecap="round"/>
  
  <!-- Seat -->
  <path d="M220 185 Q248 172 276 185" fill="none" stroke="white" stroke-width="22" stroke-linecap="round"/>
  
  <!-- Hub rear -->
  <circle cx="155" cy="330" r="18" fill="#1848C8" stroke="white" stroke-width="14"/>
  
  <!-- Hub front -->
  <circle cx="357" cy="330" r="18" fill="#1848C8" stroke="white" stroke-width="14"/>
  
  <!-- Pedal crank -->
  <circle cx="230" cy="330" r="22" fill="#1848C8" stroke="white" stroke-width="18"/>
  <line x1="230" y1="330" x2="215" y2="355" stroke="white" stroke-width="16" stroke-linecap="round"/>
  <line x1="230" y1="330" x2="245" y2="305" stroke="white" stroke-width="16" stroke-linecap="round"/>
</svg>
