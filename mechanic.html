<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-GXYD68JXZW"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#059669">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DrBike Mech">
<link rel="manifest" href="/mechanic-manifest.json">
<title>Dr. Bike — Mechanic</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/variables.css?v=20260622">
<link rel="stylesheet" href="css/mechanic.css?v=20260622">
<style>
/* PIN login */
#s-login { background: var(--navy); }
.login-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
}
.pin-inp {
  background: rgba(255,255,255,0.04);
  border: 1.5px solid var(--color-border);
  border-radius: var(--radius-md);
  color: var(--color-text);
}
.pin-inp:focus { border-color: var(--color-primary); }
.login-btn {
  background: var(--color-primary);
  border-radius: var(--radius-md);
  font-weight: 700;
}
.login-btn:hover { background: var(--color-primary-hover); }
.van-opt.sel {
  border-color: var(--color-primary);
  background: var(--color-primary-light);
  color: var(--color-text);
}
/* Inventory tab inside jobs-wrap */
#tab-inventory {
  padding: 16px;
  background: var(--color-bg);
  min-height: 100%;
  color: var(--color-text);
}
#tab-inventory h2 { color: var(--color-text); }
#inventory-list .inv-row {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: 8px;
  margin-bottom: 6px;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
#inventory-list .inv-row.low { background: var(--color-error-bg, #FEF2F2); border-color: var(--color-error, #DC2626); }
/* Checklist modal — theme-aware */
#checklist-modal .modal-inner {
  background: var(--color-surface);
  color: var(--color-text);
  max-width: 500px;
  margin: 24px auto;
  border-radius: 16px;
  padding: 24px;
  border: 1px solid var(--color-border);
}
#checklist-modal .cl-row {
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: 8px;
  margin-bottom: 4px;
  padding: 8px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
#checklist-notes {
  width: 100%;
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: 8px;
  padding: 10px;
  font-size: 13px;
  height: 80px;
  resize: vertical;
  color: var(--color-text);
  font-family: inherit;
}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- Offline banner -->
<div id="offline-banner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:9998;background:#D97706;color:#fff;padding:8px 16px;font-size:12px;font-weight:600;text-align:center">
  ⚡ You're offline — showing cached jobs. Changes will sync when back online.
</div>

<!-- LOGIN -->
<div class="screen active" id="s-login">
  <div style="display:flex;flex-direction:column;align-items:center;width:100%;max-width:380px;margin:0 auto">
    <div class="login-logo">🔧</div>
    <div class="login-title">Dr. Bike Mechanic</div>
    <div class="login-sub">Sign in to see your jobs</div>
    <div class="login-card">
      <label class="lbl">Select your van</label>
      <div class="van-grid">
        <div class="van-opt sel" id="v1" onclick="selVan(1)">🚐 Van 1<div style="font-size:11px;opacity:0.6;margin-top:2px">Inner West</div></div>
        <div class="van-opt" id="v2" onclick="selVan(2)">🚐 Van 2<div style="font-size:11px;opacity:0.6;margin-top:2px">North Shore</div></div>
      </div>
      <label class="lbl">PIN — last 4 digits of your phone</label>
      <input class="pin-inp" id="pin-inp" type="password" inputmode="numeric" maxlength="4" placeholder="••••" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="login-btn" id="login-btn" onclick="doLogin()">Sign in →</button>
      <div class="login-err" id="login-err"></div>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="screen" id="s-main">
  <div class="topbar">
    <div>
      <div class="topbar-name" id="mech-name">Mechanic</div>
      <div class="topbar-van" id="van-label">Van 1</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <button id="theme-btn-mech" onclick="toggleMechTheme()" style="background:rgba(255,255,255,0.1);border:none;border-radius:50%;width:34px;height:34px;font-size:15px;cursor:pointer">🌙</button>
      <button class="status-btn" id="status-btn" onclick="toggleStatus()">● Online</button>
    </div>
  </div>
  <div class="nav-tabs">
    <button class="nav-tab on" onclick="goTab('today',this)">Today<span class="tab-badge" id="b-today"></span></button>
    <button class="nav-tab" onclick="goTab('upcoming',this)">Upcoming<span class="tab-badge" id="b-upcoming"></span></button>
    <button class="nav-tab" onclick="goTab('agenda',this)">📅 Agenda</button>
    <button class="nav-tab" onclick="goTab('done',this)">Done<span class="tab-badge" id="b-done"></span></button>
    <button class="nav-tab" onclick="goTab('profile',this)">Profile</button>
    <button class="nav-tab" onclick="goTab('inventory',this)">📦 Stock</button>
  </div>
  <!-- jobs-list is the main content area — all tabs render here -->
  <div class="jobs-wrap" id="jobs-list">
    <div style="text-align:center;padding:60px 24px;color:var(--mgray)"><div style="font-size:32px;margin-bottom:12px">⏳</div><div>Loading...</div></div>
  </div>

  <!-- INVENTORY TAB — rendered inside jobs-list by goTab() -->
  <!-- Hidden template; JS clones this content into jobs-list -->
  <template id="tpl-inventory">
    <div id="tab-inventory">
      <h2 style="font-size:16px;font-weight:700;margin-bottom:12px">📦 Van Stock</h2>
      <div id="inventory-loading" style="text-align:center;padding:40px;color:var(--mgray)">Loading inventory...</div>
      <div id="inventory-list" style="display:none"></div>
      <div id="inventory-empty" style="display:none;text-align:center;padding:40px;color:var(--mgray)">No inventory data. Run the SQL migration first.</div>
    </div>
  </template>
</div>

<!-- SERVICE TIMER — fixed bottom bar -->
<div id="service-timer-bar" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#0D1F3C;color:#fff;padding:12px 20px;align-items:center;justify-content:space-between;z-index:999">
  <div>
    <div style="font-size:11px;opacity:.6;text-transform:uppercase">Service in progress</div>
    <div id="timer-display" style="font-size:22px;font-weight:700;font-variant-numeric:tabular-nums">00:00</div>
  </div>
  <button onclick="completeService()" style="background:#059669;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-weight:700;font-size:14px;cursor:pointer">✅ Complete</button>
</div>

<!-- PRE-SERVICE CHECKLIST MODAL — theme-aware -->
<div id="checklist-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:2000;overflow-y:auto">
  <div class="modal-inner">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <h2 style="font-size:18px;font-weight:800;color:var(--color-text)">Pre-Service Checklist</h2>
      <button onclick="closeChecklist()" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--color-text)">✕</button>
    </div>
    <div id="checklist-items"></div>
    <div style="margin-top:20px">
      <textarea id="checklist-notes" placeholder="Additional notes..."></textarea>
    </div>
    <button onclick="saveChecklist()" style="width:100%;background:#0A58CA;color:#fff;border:none;border-radius:8px;padding:14px;font-weight:700;font-size:15px;cursor:pointer;margin-top:12px">Save & Start Service ⏱️</button>
  </div>
</div>

<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
<script src="js/mechanic.js?v=20260622"></script>
</body>
</html>
