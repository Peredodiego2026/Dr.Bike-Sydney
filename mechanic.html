<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="theme-color" content="#0D1F3C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DrBike Mech">
<link rel="manifest" href="/mechanic-manifest.json">
<title>Dr. Bike — Mechanic</title>
<link rel="icon" href="/icon-mech-512.svg?v=2" type="image/svg+xml">
<link rel="icon" href="/icon-mech-192.png?v=2" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/icon-mech-192.png?v=2">
<link rel="preconnect" href="https://tgpipbloisahufaywhqb.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="css/fonts.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/variables.css?v=20260827-dark2">
<link rel="stylesheet" href="css/mechanic.css?v=ac2c801d6e">
<style>
/* PIN login - use mechanic.css variables for dark theme */
.login-card {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--r);
}
.pin-inp {
  background: rgba(255,255,255,0.06);
  border: 1.5px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  color: #fff;
}
.pin-inp:focus { border-color: var(--green); }
.login-btn {
  background: var(--green);
  border-radius: 10px;
  font-weight: 700;
}
.van-opt.sel {
  border-color: var(--green);
  background: rgba(5,150,105,0.2);
  color: #fff;
}
/* Inventory tab inside jobs-wrap */
#tab-inventory {
  padding: 16px;
  background: var(--off);
  min-height: 100%;
  color: var(--navy);
}
#tab-inventory h2 { color: var(--navy); }
#inventory-list .inv-row {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 6px;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
#inventory-list .inv-row.low { background: var(--red-lt); border-color: var(--red); }
/* Checklist modal — theme-aware */
#checklist-modal .modal-inner {
  background: var(--white);
  color: var(--navy);
  max-width: 500px;
  margin: 24px auto;
  border-radius: 16px;
  padding: 24px;
  border: 1px solid var(--border);
}
#checklist-modal .cl-row {
  background: var(--off);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 4px;
  padding: 8px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
#checklist-notes {
  width: 100%;
  background: var(--off);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px;
  font-size: 13px;
  height: 80px;
  resize: vertical;
  color: var(--navy);
  font-family: inherit;
}
[data-theme="dark"] #tab-inventory { background: var(--off); color: var(--navy); }
[data-theme="dark"] #tab-inventory h2 { color: var(--navy); }
[data-theme="dark"] #inventory-list .inv-row { background: #2C2C2E; border-color: #48484A; }
[data-theme="dark"] #inventory-list .inv-row.low { background: var(--red-lt); border-color: var(--red); }
[data-theme="dark"] #checklist-modal .modal-inner { background: #2C2C2E; color: #F2F2F7; border-color: #48484A; }
[data-theme="dark"] #checklist-modal .cl-row { background: var(--off); border-color: #48484A; }
[data-theme="dark"] #checklist-notes { background: var(--off); border-color: #48484A; color: var(--navy); }
</style>
  <!-- ── Sentry (error monitoring + session replay) ─────────────────────── -->
  <script type="text/plain" data-consent="analytics" src="https://js-de.sentry-cdn.com/dbe16e37f69ca4ae1724ab697c0f4255.min.js" crossorigin="anonymous"></script>
  <script type="text/plain" data-consent="analytics">
  Sentry.onLoad(function() {
    Sentry.init({
      dsn: "https://dbe16e37f69ca4ae1724ab697c0f4255@o4511637539651584.ingest.de.sentry.io/4511637556625488",
      environment: "production",
      release: "drbike@1.0.0",
      tracesSampleRate: 0.2,
      replaysSessionSampleRate: 0.1,
      replaysOnErrorSampleRate: 1.0,
      integrations: [
        Sentry.replayIntegration(),
        Sentry.browserTracingIntegration(),
      ],
    });
  });
  </script>
  <!-- PostHog is deliberately NOT loaded here - staff tool, same reason as
       admin.html. The mechanic app was contributing /mechanic.html at 25
       views and /mechanic at 22 to the customer analytics. -->
</head>
<body>
<div class="toast" id="toast"></div>

<!-- Offline banner -->
<div id="offline-banner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:9998;background:var(--amber);color:#fff;padding:8px 16px;font-size:12px;font-weight:600;text-align:center">
  <span id="offline-banner-text">⚡ You're offline — showing cached jobs. Changes will sync when back online.</span>
</div>
<!-- Shown while there is a queue to send, online or not: the mechanic needs to
     know his taps are still in the phone and not on the server yet. -->
<div id="sync-banner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:9997;background:var(--blue-dark);color:#fff;padding:8px 16px;font-size:12px;font-weight:600;text-align:center">
  <span id="sync-banner-text"></span>
</div>

<!-- LOGIN -->
<div class="screen active" id="s-login">
  <div style="display:flex;flex-direction:column;align-items:center;width:100%;max-width:380px;margin:0 auto">
    <div class="login-logo" style="background:none;box-shadow:none;width:auto;height:auto;margin-bottom:8px;display:flex;flex-direction:column;align-items:center;gap:10px">
      <img src="images/logo-db.png" alt="Dr. Bike Sydney" height="42" style="width:auto;display:block">
      <span style="font-weight:700;font-size:22px;letter-spacing:-0.3px;color:#fff">Dr. <span style="color:var(--blue-soft)">Bike</span> Sydney</span>
    </div>
    <div class="login-title">Mechanic App</div>
    <div style="font-size:13px;font-weight:600;color:var(--blue-soft);margin:4px 0 2px">Healthy bikes, happy riders</div>
    <div class="login-sub">Sign in to see your jobs</div>
    <div class="login-card">
      <label class="lbl">Select your van</label>
      <div class="van-grid">
        <div class="van-opt sel" id="v1">Van 1<div style="font-size:11px;opacity:0.6;margin-top:2px">Inner West</div></div>
        <div class="van-opt" id="v2">Van 2<div style="font-size:11px;opacity:0.6;margin-top:2px">North Shore</div></div>
      </div>
      <label class="lbl">Enter your PIN</label>
      <input class="pin-inp" id="pin-inp" type="password" inputmode="numeric" maxlength="6" placeholder="••••••" aria-label="PIN">
      <button class="login-btn" id="login-btn">Sign in →</button>
      <div class="login-err" id="login-err"></div>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="screen" id="s-main">
  <div class="topbar">
    <div>
      <div class="topbar-name" id="mech-name">Mechanic</div>
      <div class="topbar-van" id="van-label">Van 1</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <button id="theme-btn-mech" style="background:rgba(255,255,255,0.1);border:none;border-radius:50%;width:44px;height:44px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0" title="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" width="16" height="16"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="status-btn" id="status-btn">● Online</button>
    </div>
  </div>
  <div class="nav-tabs">
    <button class="nav-tab on" data-tab="today">Today<span class="tab-badge" id="b-today"></span></button>
    <button class="nav-tab" data-tab="upcoming">Upcoming<span class="tab-badge" id="b-upcoming"></span></button>
    <button class="nav-tab" data-tab="agenda">Agenda</button>
    <button class="nav-tab" data-tab="done">Done<span class="tab-badge" id="b-done"></span></button>
    <button class="nav-tab" data-tab="profile">Profile</button>
    <button class="nav-tab" data-tab="inventory">Stock</button>
    <button class="nav-tab" data-tab="spareparts">Spare Parts</button>
  </div>
  <!-- jobs-list is the main content area — all tabs render here -->
  <div class="jobs-wrap" id="jobs-list">
    <div style="text-align:center;padding:60px 24px;color:var(--mgray)"><div style="margin-bottom:12px;opacity:0.4"><img src="images/logo-db.png" alt="Dr. Bike Sydney" height="36" style="width:auto;display:block"></div><div>Loading...</div></div>
  </div>

  <!-- INVENTORY TAB — rendered inside jobs-list by goTab() -->
  <!-- Hidden template; JS clones this content into jobs-list -->
  <template id="tpl-inventory">
    <div id="tab-inventory">
      <h2 style="font-size:16px;font-weight:700;margin-bottom:12px">Van Stock</h2>
      <div id="inventory-loading" style="text-align:center;padding:40px;color:var(--mgray)">Loading inventory...</div>
      <div id="inventory-list" style="display:none"></div>
      <div id="inventory-empty" style="display:none;text-align:center;padding:40px;color:var(--mgray)">No inventory data. Run the SQL migration first.</div>
    </div>
  </template>

  <!-- SPARE PARTS TAB — rendered inside jobs-list by goTab() -->
  <template id="tpl-spareparts">
    <div id="tab-spareparts">
      <h2 style="font-size:16px;font-weight:700;margin-bottom:12px">Spare Parts</h2>
      <div style="position:relative;margin-bottom:14px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--mgray)" stroke-width="2" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="sp-search" placeholder="Search parts..." aria-label="Search parts" data-input="render-spare-parts" style="width:100%;padding:11px 12px 11px 36px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:var(--sans);background:var(--white);color:var(--navy);box-sizing:border-box">
      </div>
      <div id="spareparts-loading" style="text-align:center;padding:40px;color:var(--mgray)">Loading parts...</div>
      <div id="spareparts-list" style="display:none"></div>
      <div id="spareparts-empty" style="display:none;text-align:center;padding:40px;color:var(--mgray)">No parts in the catalog yet.</div>
    </div>
  </template>
</div>

<!-- SERVICE TIMER — fixed bottom bar -->
<div id="service-timer-bar" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#0D1F3C;color:#fff;padding:12px 20px;align-items:center;justify-content:space-between;z-index:999">
  <div>
    <div style="font-size:11px;opacity:.6;text-transform:uppercase">Service in progress</div>
    <div id="timer-display" style="font-size:22px;font-weight:700;font-variant-numeric:tabular-nums">00:00</div>
  </div>
  <button id="complete-service-btn" style="background:var(--green);color:#fff;border:none;border-radius:8px;padding:10px 20px;font-weight:700;font-size:14px;cursor:pointer">Complete</button>
</div>

<!-- PRE-SERVICE CHECKLIST MODAL — theme-aware -->
<div id="checklist-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:2000;overflow-y:auto">
  <div class="modal-inner">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <h2 style="font-size:18px;font-weight:800;color:var(--color-text)">Pre-Service Checklist</h2>
      <button id="checklist-close-btn" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--color-text)">✕</button>
    </div>
    <div id="checklist-items"></div>
    <div style="margin-top:20px">
      <textarea id="checklist-notes" placeholder="Additional notes..."></textarea>
    </div>
    <button id="checklist-save-btn" style="width:100%;background:var(--blue);color:#fff;border:none;border-radius:8px;padding:14px;font-weight:700;font-size:15px;cursor:pointer;margin-top:12px">Save & Start Service ⏱️</button>
  </div>
</div>

<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
<script src="js/mechanic.js?v=c1d856b1ef"></script>
</body>
</html>
