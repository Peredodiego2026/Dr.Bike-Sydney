<script>
// ── PERSISTENT STORAGE ADAPTER (IndexedDB + localStorage) ───────────────────
const _IDB = (() => {
  const DB='dr-bike-mech-auth', ST='s', VER=1;
  let _db=null;
  const open=()=>new Promise((res,rej)=>{
    if(_db){res(_db);return;}
    const r=indexedDB.open(DB,VER);
    r.onerror=()=>rej(r.error);
    r.onsuccess=()=>{_db=r.result;res(_db);};
    r.onupgradeneeded=e=>e.target.result.createObjectStore(ST);
  });
  return {
    async get(k){
      try{
        const ls=localStorage.getItem(k);
        if(ls)return ls;
        const db=await open();
        return new Promise((res)=>{
          const req=db.transaction(ST,'readonly').objectStore(ST).get(k);
          req.onsuccess=()=>{if(req.result)try{localStorage.setItem(k,req.result);}catch(e){}res(req.result??null);};
          req.onerror=()=>res(null);
        });
      }catch{return localStorage.getItem(k);}
    },
    async set(k,v){
      try{localStorage.setItem(k,v);}catch(e){}
      try{const db=await open();db.transaction(ST,'readwrite').objectStore(ST).put(v,k);}catch{}
    },
    async remove(k){
      try{localStorage.removeItem(k);}catch{}
      try{const db=await open();db.transaction(ST,'readwrite').objectStore(ST).delete(k);}catch{}
    }
  };
})();

const sb = supabase.createClient('https://tgpipbloisahufaywhqb.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRncGlwYmxvaXNhaHVmYXl3aHFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MTM4NjgsImV4cCI6MjA5MzQ4OTg2OH0.P1lpqPVmW0HE3PwHeUhRw20eRP3ApdDGYuiwtJhRD9U', {
  auth: { persistSession: true, autoRefreshToken: true, storage: { getItem: k=>_IDB.get(k), setItem: (k,v)=>_IDB.set(k,v), removeItem: k=>_IDB.remove(k) } }
});
// Init theme
(function(){
  const saved = localStorage.getItem('drbike-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
})();
let mechanic=null, vanNum=1, jobs=[], tab='today', online=true;
let timerIntervals = {};
let isOffline = !navigator.onLine;

// ── OFFLINE DETECTION ─────────────────────────────────────────────────────────
function updateOnlineStatus() {
  isOffline = !navigator.onLine;
  const banner = document.getElementById('offline-banner');
  if(banner) banner.style.display = isOffline ? 'flex' : 'none';
  if(!isOffline && mechanic) { load(); } // auto-sync cuando vuelve internet
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);

function ratingHTML(jobs){
  const rated = jobs.filter(j=>j.rating);
  if(rated.length === 0) return '<div style="text-align:center;padding:16px;background:#fff;border-radius:12px;border:1px solid var(--border);color:var(--mgray);font-size:13px">No ratings yet — complete jobs to get reviews!</div>';
  const avg = (rated.reduce((s,j)=>s+(j.rating||0),0)/rated.length).toFixed(1);
  const stars = '⭐'.repeat(Math.round(avg));
  return `<div style="background:#fff;border-radius:12px;border:1px solid var(--border);padding:16px;text-align:center;margin-bottom:16px">
    <div style="font-size:32px;font-weight:800;color:var(--navy)">${avg}</div>
    <div style="font-size:20px;margin:4px 0">${stars}</div>
    <div style="font-size:12px;color:var(--mgray)">${rated.length} review${rated.length!==1?'s':''}</div>
    ${rated.slice(-3).reverse().map(j=>`<div style="margin-top:10px;padding:10px;background:var(--off);border-radius:8px;text-align:left">
      <div style="font-size:11px;font-weight:600;color:var(--navy)">${'⭐'.repeat(j.rating||0)} ${j.client}</div>
      ${j.review?`<div style="font-size:11px;color:var(--mgray);margin-top:3px;font-style:italic">"${j.review}"</div>`:''}
    </div>`).join('')}
  </div>`;
}

async function init(){
  const s = localStorage.getItem('drbike-mech');
  if(s){ 
    try{ 
      mechanic=JSON.parse(s); 
      vanNum=mechanic.van_number||1; 
      go('s-main'); 
      updateUI(); 
      // Timeout de seguridad - si load() tarda más de 8s, mostrar error
      const loadTimeout = setTimeout(() => {
        if(document.getElementById('jobs-list')?.innerHTML.includes('Loading')) {
          document.getElementById('jobs-list').innerHTML = '<div style="text-align:center;padding:40px;color:var(--mgray)"><div style="font-size:32px;margin-bottom:12px">📡</div><div style="font-weight:600;color:var(--navy)">Taking longer than usual</div><div style="font-size:13px;margin-top:8px">Check your connection</div><button onclick="load()" style="margin-top:16px;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:var(--sans)">Retry</button></div>';
        }
      }, 8000);
      await load();
      clearTimeout(loadTimeout);
      sub(); 
    }catch(e){ 
      localStorage.removeItem('drbike-mech'); 
    } 
  }
}

async function doLogin(){
  const pin = document.getElementById('pin-inp').value.trim();
  if(pin.length<4){ err('Enter your 4-digit PIN'); return; }
  const btn=document.getElementById('login-btn');
  btn.textContent='Signing in...'; btn.disabled=true;

  try {
    const {data, error} = await sb.from('escalation_contacts').select('*');
    const contacts = data || [];
    const m = contacts.find(c => c.phone && c.phone.replace(/[\s+\-()]/g,'').slice(-4) === pin);
    btn.textContent='Sign in →'; btn.disabled=false;
    if(!m){ err('Invalid PIN — use last 4 digits of your phone'); return; }
    mechanic={...m, van_number:vanNum};
    localStorage.setItem('drbike-mech',JSON.stringify(mechanic));
    go('s-main'); updateUI(); await load(); sub();
  } catch(e) {
    btn.textContent='Sign in →'; btn.disabled=false;
    err('Connection error — try again');
  }
}

function err(msg){ const e=document.getElementById('login-err'); e.textContent=msg; e.style.display='block'; setTimeout(()=>e.style.display='none',3000); }
function doLogout(){ if(!confirm('Sign out?')) return; localStorage.removeItem('drbike-mech'); mechanic=null; jobs=[]; go('s-login'); }
function selVan(n){ vanNum=n; document.querySelectorAll('.van-opt').forEach(v=>v.classList.remove('sel')); document.getElementById('v'+n).classList.add('sel'); }

async function load(){
  try {
    const {data, error} = await sb.from('bookings').select('id, client_id, service_name, service_price, scheduled_date, scheduled_time, status, suburb, address, van_number, notes, mechanic_notes, client_rating, client_review').eq('van_number',vanNum).order('scheduled_date').order('scheduled_time');
    if(error) throw error;
    // Obtener nombres de clientes por separado
    const clientIds = [...new Set((data||[]).map(b=>b.client_id).filter(Boolean))];
    let profileMap = {};
    if(clientIds.length) {
      // Usar or() en vez de in() para evitar el 400
      // Fetch profiles one by one to avoid filter issues with UUIDs
      const profResults = await Promise.all(clientIds.map(id => sb.from('profiles').select('id, full_name, phone_number').eq('id', id).single()));
      const profs = profResults.map(r => r.data).filter(Boolean);
      (profs||[]).forEach(p => profileMap[p.id] = p);
    }
    const mapped = (data||[]).map(b=>({id:b.id,client:b.client_name||b.client_email?.split('@')[0]||'Client',email:b.client_email||'',phone:b.client_phone||'',service:b.service_name||'Service',price:b.service_price||0,date:b.scheduled_date,time:b.scheduled_time||'',address:b.address||'',suburb:b.suburb||'',status:b.status||'pending',notes:b.notes||'',mnotes:b.mechanic_notes||'',rating:b.client_rating,review:b.client_review}));
    jobs = mapped;
    try { localStorage.setItem('drbike-jobs-cache', JSON.stringify(jobs)); } catch(e){}
    render(); badges();
  } catch(e) {
    console.error('load() CATCH ERROR:', e.message, e);
    const cached = localStorage.getItem('drbike-jobs-cache');
    if(cached) {
      jobs = JSON.parse(cached);
      render(); badges();
      toast('⚡ Offline — showing cached jobs');
    } else {
      document.getElementById('jobs-list').innerHTML = '<div style="text-align:center;padding:40px;color:red">Error: ' + e.message + '</div>';
    }
  }
}

function sub(){
  const mechChannel = sb.channel('mech-jobs')
    .on('postgres_changes',{event:'*',schema:'public',table:'bookings'},p=>{ 
      load(); 
      if(p.eventType==='INSERT') {
        alert2(p.new);
        sendPushNotif(p.new);
      }
    }).subscribe();
  window.addEventListener('beforeunload', () => sb.removeChannel(mechChannel));
  requestPushPermission();
}

async function requestPushPermission(){
  if(!('Notification' in window) || !('serviceWorker' in navigator)) return;
  if(Notification.permission === 'granted') return;
  if(Notification.permission === 'denied') return;
  const perm = await Notification.requestPermission();
  if(perm === 'granted') toast('🔔 Push notifications enabled!');
}

async function sendPushNotif(job){
  if(!('Notification' in window)) return;
  if(Notification.permission !== 'granted') return;
  // Show native browser notification (works even when app is open)
  const reg = await navigator.serviceWorker.ready;
  reg.showNotification('🔔 New job — Dr. Bike', {
    body: `${job.service_name||'Service'} · ${job.suburb||''} · $${job.service_price||0}`,
    icon: '/icon-mech-192.png',
    badge: '/icon-mech-192.png',

function render(){
  const today=new Date().toISOString().split('T')[0];
  let list;
  if(tab==='today') list=jobs.filter(j=>j.date===today&&j.status!=='completed'&&j.status!=='cancelled');
  else if(tab==='upcoming') list=jobs.filter(j=>j.date>today&&j.status!=='cancelled');
  else if(tab==='done') list=jobs.filter(j=>j.status==='completed');
  else if(tab==='agenda'){ renderAgenda(); return; }
  else { profile(); return; }
  const c=document.getElementById('jobs-list');
  if(!list.length){ const m={today:'☀️|No jobs today|New bookings appear instantly',upcoming:'📅|No upcoming jobs|Future bookings show here',done:'✅|No completed jobs|Completed jobs appear here'}[tab]?.split('|'); c.innerHTML=`<div style="text-align:center;padding:60px 24px;color:var(--mgray)"><div style="font-size:48px;margin-bottom:16px">${m[0]}</div><div style="font-size:16px;font-weight:600;color:var(--navy);margin-bottom:8px">${m[1]}</div><div style="font-size:13px">${m[2]}</div></div>`; return; }
  c.innerHTML=list.map(j=>card(j)).join('');
  // Attach swipe gestures for pending jobs
  list.filter(j=>j.status==='pending').forEach(j=>{
    const el = c.querySelector(`[data-job-id="${j.id}"]`);
    if(el) attachSwipe(el, j.id);
  });
  // Start timers for enroute jobs
  list.filter(j=>j.status==='enroute').forEach(j=>startRouteTimer(j.id));
}

function attachSwipe(card, jobId){
  let startX=0, currentX=0;
  card.addEventListener('touchstart', e=>{ startX=e.touches[0].clientX; }, {passive:true});
  card.addEventListener('touchmove', e=>{
    currentX=e.touches[0].clientX-startX;
    if(currentX>0){ card.style.transform=`translateX(${Math.min(currentX,120)}px)`; card.style.transition='none'; card.style.background=`rgba(5,150,105,${Math.min(currentX/120,1)*0.25})`; }
  },{passive:true});
  card.addEventListener('touchend', ()=>{
    card.style.transition='transform .3s,background .3s';
    if(currentX>80){ card.style.transform='translateX(110%)'; setTimeout(()=>setStatus(jobId,'confirmed'),300); }
    else{ card.style.transform=''; card.style.background=''; }
    currentX=0;
  });
}

function startRouteTimer(jobId){
  const key='enroute-start-'+jobId;
  if(!localStorage.getItem(key)) localStorage.setItem(key, Date.now());
  if(timerIntervals[jobId]) return;
  timerIntervals[jobId]=setInterval(()=>{
    const start=parseInt(localStorage.getItem(key)||Date.now());
    const elapsed=Math.floor((Date.now()-start)/1000);
    const mm=String(Math.floor(elapsed/60)).padStart(2,'0');
    const ss=String(elapsed%60).padStart(2,'0');
    const el=document.getElementById('timer-'+jobId);
    if(el) el.textContent=`🕐 En route: ${mm}:${ss}`;
    else{ clearInterval(timerIntervals[jobId]); delete timerIntervals[jobId]; }
  },1000);
}

function stopRouteTimer(jobId){
  clearInterval(timerIntervals[jobId]); delete timerIntervals[jobId];
  localStorage.removeItem('enroute-start-'+jobId);
}

function checklistChanged(){
  const requiredItems = document.querySelectorAll('#service-checklist .chk-item[data-required="true"]');
  const allRequiredDone = requiredItems.length === 0 || [...requiredItems].every(c => c.checked);
  const btn = document.querySelector('#complete-modal button[onclick^="submitComplete"]');
  if(btn){
    btn.disabled = !allRequiredDone;
    btn.style.opacity = allRequiredDone ? '1' : '0.5';
    btn.style.cursor = allRequiredDone ? 'pointer' : 'not-allowed';
    btn.title = allRequiredDone ? '' : '⚠️ Complete the 3 required safety checks first';
  }
}

async function setStatus(id, status) {
  await sb.from('bookings').update({status}).eq('id', id);
  const j = jobs.find(x => x.id === id);
  if (j) j.status = status;
  render(); badges();
  toast(status === 'enroute' ? '🚐 En route' : 'Updated');
  if (status === 'enroute') {
    startGPS(id);
    notifyClientEnroute(j);
  } else if (status === 'confirmed') {
    // Mechanic accepted the job — push notif to client
    if (j?.client_id) sendClientPush(j.client_id, {
      title: '🔧 Mechanic assigned — Dr. Bike Sydney',
      body: `${(mechanic?.first_name||'Your mechanic')} has accepted your ${j.service||'booking'}. We'll notify you when they're on the way.`,
      url: '/',
      tag: 'booking-accepted-' + id
    });
  } else if (status === 'completed' || status === 'cancelled') { stopGPS(); stopRouteTimer(id); }
}

// Send a push notification to a client via their stored browser subscription
async function sendClientPush(clientId, { title, body, url, tag }) {
  try {
    await fetch('/api/send-push', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ clientId, title, body, url: url||'/', tag })
    });
  } catch(e) { console.warn('Push to client failed:', e); }
}

function notifyClientEnroute(j) {
  if (!j) return;
  const mechName = ((mechanic?.first_name || '') + ' ' + (mechanic?.last_name || '')).trim() || 'Your mechanic';
  const trackUrl = `https://drbikesydney.com.au/?tracking=${j.id}`;

  // SMS + WhatsApp (works even if app not installed)
  if (j.phone) {
    const smsBody = JSON.stringify({
      to: j.phone, name: j.client, mechName, service: j.service,
      address: j.suburb, price: j.price, type: 'enroute', bookingId: j.id
    });
    Promise.allSettled([
      fetch('/api/send-sms',      { method:'POST', headers:{'Content-Type':'application/json'}, body: smsBody }),
      fetch('/api/send-whatsapp', { method:'POST', headers:{'Content-Type':'application/json'}, body: smsBody }),
    ]);
  }

  // Push notification to app (if client has it installed + subscribed)
  if (j.client_id) sendClientPush(j.client_id, {
    title: `🚐 ${mechName} is on the way!`,
    body: `Heading to ${j.suburb||'your address'} for your ${j.service}. Est. arrival: 10–20 min. Tap to track live 📍`,
    url: `/?action=dashboard&tracking=${j.id}`,
    tag: 'mechanic-enroute-' + j.id,
    badge: '/icon-mech-192.png',
    icon: '/icon-512.svg'
  });
}

    canvas.height = 120 * window.devicePixelRatio;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = '120px';
    const ctx = canvas.getContext('2d');
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    ctx.strokeStyle = '#0D1F3C'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    let drawing = false;
    const getPos = e => {
      const r = canvas.getBoundingClientRect();
      const t = e.touches?.[0] || e;
      return { x: (t.clientX-r.left), y: (t.clientY-r.top) };
    };
    canvas.addEventListener('mousedown', e => { drawing=true; ctx.beginPath(); const p=getPos(e); ctx.moveTo(p.x,p.y); });
    canvas.addEventListener('mousemove', e => { if(!drawing) return; const p=getPos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); });
    canvas.addEventListener('mouseup', ()=>drawing=false);
    canvas.addEventListener('touchstart', e => { e.preventDefault(); drawing=true; ctx.beginPath(); const p=getPos(e); ctx.moveTo(p.x,p.y); });

function previewPhoto(type){

function clearSig(){

async function uploadPhoto(bookingId, file, type){
  if(!file) return null;
  try {
    const ext = file.name.split('.').pop() || 'jpg';
    const path = `jobs/${bookingId}/${type}_${Date.now()}.${ext}`;
    const { data, error } = await sb.storage.from('job-photos').upload(path, file, { upsert: true });
    if(error) { console.warn('Photo upload error:', error.message); return null; }
    const { data: urlData } = sb.storage.from('job-photos').getPublicUrl(path);
    return urlData?.publicUrl || null;
  } catch(e) { console.warn('Photo upload exception:', e); return null; }
}

async function submitComplete(id){
  const notes = document.getElementById('comp-notes')?.value||'';
  const parts = document.getElementById('comp-parts')?.value||'';
  const nextDate = document.getElementById('comp-next')?.value||null;
  const canvas = document.getElementById('sig-canvas');
  const signature = canvas ? canvas.toDataURL('image/png') : null;

  const btn = document.querySelector('#complete-modal button[onclick*="submitComplete"]');
  if(btn){ btn.textContent='Saving...'; btn.disabled=true; }

  // Upload photos
  const beforeFile = document.getElementById('photo-before')?.files?.[0];
  const afterFile = document.getElementById('photo-after')?.files?.[0];
  const [photoBeforeUrl, photoAfterUrl] = await Promise.all([
    uploadPhoto(id, beforeFile, 'before'),
    uploadPhoto(id, afterFile, 'after')
  ]);

  const updateData = {
    status:'completed',
    mechanic_notes: notes,
    parts_used: parts,
    next_service_date: nextDate,
    client_signature: signature,
    completed_at: new Date().toISOString()
  };
  if(photoBeforeUrl) updateData.photo_before = photoBeforeUrl;
  if(photoAfterUrl) updateData.photo_after = photoAfterUrl;

  await sb.from('bookings').update(updateData).eq('id',id);

  document.getElementById('complete-modal').remove();
  const j = jobs.find(x=>x.id===id);
  if(j) j.status='completed';
  render(); badges();
  stopGPS();
  toast('✅ Job completed!' + (photoBeforeUrl||photoAfterUrl ? ' Photos saved.' : ''));
  // Push al cliente
  const jDone = jobs.find(x=>x.id===id);
  if(jDone) notifyClientComplete(jDone);

  stopGPS();

  // Send completion email + SMS review request (non-blocking, parallel)
  try {
    const clientEmail = j?.email || '';
    const clientName  = j?.client || 'Client';
    const reviewLink  = `https://drbikesydney.com.au/?review=${id}`;
    const nextSvcMsg  = nextDate
      ? `Your next recommended service is on ${new Date(nextDate).toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'})}`
      : 'We recommend a service check every 3–6 months.';

    // Fire all notifications in parallel
    await Promise.allSettled([
      // 1. Invoice/receipt email
      clientEmail ? fetch('/api/send-invoice', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          bookingId: id, to: clientEmail, clientName,
          service: j?.service_name || j?.service,
          date: j?.scheduled_date, time: j?.scheduled_time,
          address: j?.address || j?.suburb,
          price: j?.price || 0, discount: j?.discount_applied || 0,
          mechNotes: notes||null, mechName: ((mechanic?.first_name||'')+ ' '+(mechanic?.last_name||'')).trim(),
          nextService: nextSvcMsg, bookingRef: id.slice(0,8).toUpperCase()
        })
      }) : Promise.resolve(),
      // 2. SMS review request
      j?.phone ? fetch('/api/send-sms', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          to: j.phone, name: clientName,
          service: j?.service, price: j?.price,
          type:'review_request', bookingId: id,
          reviewLink
        })
      }) : Promise.resolve(),
      // 3. WhatsApp review request
      j?.phone ? fetch('/api/send-whatsapp', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          to: j.phone, name: clientName,
          service: j?.service, price: j?.price,
          type:'review_request', bookingId: id,
          reviewLink
        })
      }) : Promise.resolve()
    ]);
  } catch(e){ console.log('Notification error',e); }
}

function renderAgenda(){
  const c = document.getElementById('jobs-list');
  if(!c) return;
  
  // Group jobs by date for next 7 days
  const days = [];
  for(let i=0; i<7; i++){
    const d = new Date(); d.setDate(d.getDate()+i);
    days.push(d.toISOString().split('T')[0]);
  }
  
  let html = '<div style="padding:0 16px 16px">';
  days.forEach(date=>{
    const dayJobs = jobs.filter(j=>j.date===date&&j.status!=='cancelled');
    const dateObj = new Date(date+'T00:00:00');
    const isToday = date===new Date().toISOString().split('T')[0];
    const label = isToday ? 'Today' : dateObj.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'short'});
    const revenue = dayJobs.reduce((s,j)=>s+j.price,0);
    
    html += `<div style="margin-top:16px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div style="font-size:13px;font-weight:700;color:${isToday?'#1848C8':'#0D1F3C'}">${label}</div>
        ${dayJobs.length?`<div style="font-size:12px;color:#6B7280">${dayJobs.length} job${dayJobs.length!==1?'s':''} · $${revenue}</div>`:''}
      </div>`;
    
    if(!dayJobs.length){
      html += `<div style="padding:12px;background:rgba(0,0,0,0.03);border-radius:8px;text-align:center;font-size:12px;color:#9CA3AF">No jobs scheduled</div>`;
    } else {
      // Timeline view
      const times = ['8:00 am','8:30 am','9:00 am','9:30 am','10:00 am','10:30 am','11:00 am','11:30 am','12:00 pm','12:30 pm','1:00 pm','1:30 pm','2:00 pm','2:30 pm','3:00 pm','3:30 pm','4:00 pm','4:30 pm','5:00 pm'];
      const stColors={pending:'#D97706',confirmed:'#1848C8',enroute:'#059669',completed:'#059669'};
      
      dayJobs.sort((a,b)=>(a.time||'').localeCompare(b.time||'')).forEach(j=>{
        const color = stColors[j.status]||'#6B7280';
        html += `<div style="display:flex;gap:10px;margin-bottom:8px;align-items:flex-start">
          <div style="width:52px;font-size:11px;color:#9CA3AF;padding-top:10px;flex-shrink:0;text-align:right">${j.time||'—'}</div>
          <div style="flex:1;background:${color}12;border-left:3px solid ${color};border-radius:0 8px 8px 0;padding:10px 12px;cursor:pointer" onclick="openMechChat('${j.id}')">
            <div style="font-size:13px;font-weight:600;color:#0D1F3C">${j.service}</div>
            <div style="font-size:12px;color:#6B7280;margin-top:2px">${j.client} · ${j.suburb||j.address||'—'}</div>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px">
              <span style="font-size:11px;font-weight:600;color:${color}">${j.status.toUpperCase()}</span>
              <span style="font-size:13px;font-weight:700;color:#0D1F3C">$${j.price}</span>
            </div>
          </div>
        </div>`;
      });
    }
    html += '</div>';
  });
  html += '</div>';
  c.innerHTML = html;
}

// ── JOB CHAT ────────────────────────────────────────────────────────────────
let mechChatChannel = null;
let mechChatBookingId = null;

function openMechChat(bookingId){
  mechChatBookingId = bookingId;
  // Create modal
  let modal = document.getElementById('mech-chat-modal');
  if(!modal){
    modal = document.createElement('div');
    modal.id = 'mech-chat-modal';
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:flex-end';
    modal.innerHTML = `
      <div style="background:var(--white);border-radius:16px 16px 0 0;width:100%;max-height:80vh;display:flex;flex-direction:column">
        <div style="padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
          <div style="font-weight:700;color:var(--navy);font-size:14px">💬 Chat with client</div>
          <button onclick="closeMechChat()" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--mgray)">×</button>
        </div>
        <div id="mech-chat-msgs" style="flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--off);min-height:200px"></div>
        <div style="display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--border);align-items:center">
          <label style="display:flex;align-items:center;justify-content:center;width:38px;height:38px;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;flex-shrink:0;font-size:18px;background:var(--off)" title="Send photo">
            📷
            <input type="file" accept="image/*" capture="environment" id="mech-chat-photo-inp" style="display:none" onchange="sendMechPhoto()">
          </label>
          <input id="mech-chat-inp" style="flex:1;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:var(--sans);font-size:13px;background:var(--white);color:var(--navy)" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMechMessage()">
          <button onclick="sendMechMessage()" style="background:#1848C8;color:#fff;border:none;border-radius:8px;padding:0 16px;height:38px;cursor:pointer;font-size:18px">→</button>
        </div>
      </div>`;
    document.body.appendChild(modal);
  }
  modal.style.display = 'flex';
  loadMechMessages(bookingId);

  if(mechChatChannel) sb.removeChannel(mechChatChannel);
  mechChatChannel = sb.channel('mech-chat-' + bookingId)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'job_messages',filter:`booking_id=eq.${bookingId}`},
      p => appendMechMessage(p.new))
    .subscribe();
}

function closeMechChat(){
  document.getElementById('mech-chat-modal').style.display = 'none';
  if(mechChatChannel){ sb.removeChannel(mechChatChannel); mechChatChannel=null; }
}

async function loadMechMessages(bookingId){
  const {data} = await sb.from('job_messages').select('*').eq('booking_id',bookingId).order('created_at',{ascending:true});
  const c = document.getElementById('mech-chat-msgs');
  if(!c) return;
  c.innerHTML = '';
  if(!data?.length){ c.innerHTML='<div style="text-align:center;color:#6B7280;font-size:12px;padding:20px">No messages yet</div>'; return; }
  data.forEach(m=>appendMechMessage(m,false));
  c.scrollTop = c.scrollHeight;
}

function appendMechMessage(msg, scroll=true){
  const c = document.getElementById('mech-chat-msgs');
  if(!c) return;
  c.querySelector('div[style*="text-align:center"]')?.remove();
  const isMech = msg.sender_role === 'mechanic';
  const div = document.createElement('div');
  div.style.cssText = `display:flex;flex-direction:column;align-items:${isMech?'flex-end':'flex-start'};gap:2px;margin-bottom:6px`;
  const bubble = document.createElement('div');
  bubble.style.cssText = `max-width:75%;padding:8px 12px;border-radius:${isMech?'12px 12px 4px 12px':'12px 12px 12px 4px'};font-size:13px;background:${isMech?'#1848C8':'#fff'};color:${isMech?'#fff':'#0D1F3C'};border:${isMech?'none':'1px solid #E5E7EB'}`;
  const photoMatch = msg.message?.match(/^\[PHOTO:(.*)\]$/);
  if(photoMatch){
    const img = document.createElement('img');
    img.src = photoMatch[1];
    img.style.cssText = 'max-width:200px;border-radius:8px;display:block;cursor:pointer';
    img.onclick = () => window.open(photoMatch[1], '_blank');
    bubble.style.padding = '4px';
    bubble.appendChild(img);
  } else {
    bubble.textContent = msg.message;
  }
  const time = document.createElement('div');
  time.style.cssText = 'font-size:10px;color:#6B7280';
  time.textContent = new Date(msg.created_at).toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'});
  div.appendChild(bubble); div.appendChild(time);
  c.appendChild(div);
  if(scroll) c.scrollTop = c.scrollHeight;
}

async function sendMechPhoto(){
  const inp = document.getElementById('mech-chat-photo-inp');
  if(!inp?.files?.[0] || !mechChatBookingId) return;
  const file = inp.files[0];
  inp.value = '';
  toast('Uploading photo...');
  const ext = file.name.split('.').pop() || 'jpg';
  const path = `chat/${mechChatBookingId}/${Date.now()}.${ext}`;
  const { data, error } = await sb.storage.from('job-photos').upload(path, file, { contentType: file.type, upsert: false });
  if(error){ toast('Upload failed'); return; }
  const { data: urlData } = sb.storage.from('job-photos').getPublicUrl(path);
  const url = urlData?.publicUrl;
  if(!url){ toast('Could not get photo URL'); return; }
  await sb.from('job_messages').insert({ booking_id: mechChatBookingId, sender_role:'mechanic', sender_id: mechanic?.id||'mech', message: `[PHOTO:${url}]` });
  toast('Photo sent');
}

async function sendMechMessage(){
  if(!mechChatBookingId) return;
  const inp = document.getElementById('mech-chat-inp');
  const text = inp?.value?.trim();
  if(!text) return;
  inp.value = '';
  await sb.from('job_messages').insert({ booking_id: mechChatBookingId, sender_role:'mechanic', sender_id: mechanic?.id||'mech', message: text });
}

// ── GPS TRACKING ──────────────────────────────────────────────────────────────
let gpsInterval = null;
let activeJobId = null;
let watchId = null;

function startGPS(bookingId) {
  activeJobId = bookingId;
  if (!navigator.geolocation) { toast('GPS not available'); return; }
  toast('📍 Location sharing started');

  // Send immediately
  sendLocation(bookingId);

  // Then every 10 seconds
  gpsInterval = setInterval(() => sendLocation(bookingId), 10000);

  // Also use watchPosition for smoother updates
  watchId = navigator.geolocation.watchPosition(
    pos => upsertLocation(bookingId, pos.coords.latitude, pos.coords.longitude, pos.coords.heading || 0),
    err => console.warn('GPS error:', err),
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
  );
}

function sendLocation(bookingId) {
  navigator.geolocation.getCurrentPosition(
    pos => upsertLocation(bookingId, pos.coords.latitude, pos.coords.longitude, pos.coords.heading || 0),
    err => console.warn('GPS error:', err),
    { enableHighAccuracy: true, timeout: 8000 }
  );
}

async function upsertLocation(bookingId, lat, lng, heading) {
  const mechanicId = mechanic?.id || 'unknown';
  // Check if record exists
  const { data } = await sb.from('mechanic_locations')
    .select('id').eq('booking_id', bookingId).limit(1);

  if (data && data[0]) {
    await sb.from('mechanic_locations')
      .update({ lat, lng, heading, updated_at: new Date().toISOString() })
      .eq('booking_id', bookingId);
  } else {
    await sb.from('mechanic_locations')
      .insert({ mechanic_id: mechanicId, booking_id: bookingId, lat, lng, heading });
  }
}

function stopGPS() {
  if (gpsInterval) { clearInterval(gpsInterval); gpsInterval = null; }
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  activeJobId = null;
}

// Resume tracking if there's an active enroute job on page load
async function resumeTrackingIfNeeded() {
  const today = new Date().toISOString().split('T')[0];
  const enroute = jobs.find(j => j.status === 'enroute' && j.date === today);
  if (enroute) startGPS(enroute.id);
}
