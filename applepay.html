<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Pay Diagnostic — Dr. Bike</title>
<link rel="icon" href="/icon-512.svg?v=2" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png?v=2" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<script src="https://js.stripe.com/v3/"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,sans-serif}
body{background:#0D1F3C;color:#fff;padding:20px;line-height:1.5}
h1{font-size:22px;margin-bottom:16px;color:#fff}
.subtitle{font-size:13px;color:var(--gray-lt);margin-bottom:24px}
.step{background:#1E2D4D;border-left:4px solid var(--gray);border-radius:8px;padding:14px 16px;margin-bottom:10px}
.step.pending{border-color:var(--gray)}
.step.ok{border-color:#10B981;background:#0F3D2C}
.step.fail{border-color:#EF4444;background:#3D1515}
.step.warn{border-color:#F59E0B;background:#3D2A0F}
.step .label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;opacity:0.7}
.step .value{font-size:14px;font-weight:600;word-break:break-all}
.step .detail{font-size:11px;color:var(--gray-lt);margin-top:6px;word-break:break-all}
.pr-button-area{margin-top:24px;padding:16px;background:#fff;border-radius:10px;min-height:60px}
.pr-button-area-title{color:#0D1F3C;font-size:13px;font-weight:700;margin-bottom:8px}
#pr-button{min-height:48px}
.final{margin-top:20px;padding:14px;background:#1E2D4D;border-radius:8px;font-size:12px;color:var(--gray-lt)}
</style>
</head>
<body>
<h1>🔍 Apple Pay Diagnostic</h1>
<div class="subtitle">This page checks EVERY condition required for Apple Pay to appear, in order. Take a screenshot of the results and send it.</div>

<div id="results"></div>

<div class="pr-button-area">
  <div class="pr-button-area-title">If Apple Pay is supported, it appears below:</div>
  <div id="pr-button"></div>
  <div id="pr-status" style="font-size:11px;color:var(--gray);margin-top:8px"></div>
</div>

<div class="final" id="conclusion">Running checks…</div>

<script>
const results = document.getElementById('results');
const checks = [];

function addCheck(label, status, value, detail) {
  checks.push({ label, status, value, detail });
  const div = document.createElement('div');
  div.className = 'step ' + status;
  div.innerHTML = `<div class="label">${label}</div><div class="value">${value}</div>${detail ? `<div class="detail">${detail}</div>` : ''}`;
  results.appendChild(div);
}

(async function run() {
  // 1. URL / hostname
  addCheck('URL hostname', 'ok', window.location.hostname, 'Full URL: ' + window.location.href);

  // 2. HTTPS
  const https = window.location.protocol === 'https:';
  addCheck('HTTPS protocol', https ? 'ok' : 'fail', https ? 'YES' : 'NO — Apple Pay requires HTTPS');

  // 3. User agent
  const ua = navigator.userAgent;
  const isSafari = /Safari/.test(ua) && !/Chrome|CriOS|FxiOS/.test(ua);
  const isIOS = /iPhone|iPad/.test(ua);
  addCheck('Browser / device', (isSafari && isIOS) ? 'ok' : 'warn',
    (isIOS ? 'iOS ' : 'non-iOS ') + (isSafari ? 'Safari' : 'NOT Safari'),
    'User-Agent: ' + ua);

  // 4. Native Apple Pay JS API
  const nativeApplePay = typeof window.ApplePaySession !== 'undefined';
  addCheck('Native ApplePaySession API', nativeApplePay ? 'ok' : 'fail',
    nativeApplePay ? 'AVAILABLE' : 'NOT AVAILABLE',
    nativeApplePay ? 'Browser exposes Apple Pay API.' : 'Browser does NOT expose Apple Pay JS — this only exists on Safari.');

  // 5. Native canMakePayments() check (most reliable)
  let nativeCanPay = null, nativeErr = null;
  if (nativeApplePay) {
    try {
      nativeCanPay = window.ApplePaySession.canMakePayments();
    } catch (e) { nativeErr = e.message; }
    addCheck('ApplePaySession.canMakePayments()', nativeCanPay === true ? 'ok' : 'fail',
      nativeCanPay === true ? 'TRUE — device has Apple Pay enabled' : 'FALSE — Apple Pay not enabled on this device',
      nativeErr || 'This is the most reliable check.');
  }

  // 6. Native canMakePaymentsWithActiveCard for our merchant
  // (We can't run this without a real merchant ID — skip but note)

  // 7. Permissions-Policy
  let payAllowed = null;
  try {
    if (document.featurePolicy && typeof document.featurePolicy.allowsFeature === 'function') {
      payAllowed = document.featurePolicy.allowsFeature('payment');
    } else {
      payAllowed = 'API not supported by browser';
    }
  } catch (e) { payAllowed = 'error: ' + e.message; }
  addCheck('Permissions-Policy payment',
    payAllowed === true ? 'ok' : (payAllowed === false ? 'fail' : 'warn'),
    String(payAllowed),
    'Should be TRUE. If FALSE, the page header is blocking Apple Pay.');

  // 8. Stripe SDK loaded
  const stripeLoaded = typeof window.Stripe === 'function';
  addCheck('Stripe.js SDK', stripeLoaded ? 'ok' : 'fail',
    stripeLoaded ? 'LOADED' : 'NOT LOADED',
    stripeLoaded ? '' : 'Stripe.js failed to load — check network / ad-blockers.');

  if (!stripeLoaded) {
    document.getElementById('conclusion').textContent = 'STOP: Stripe.js did not load. Cannot check Apple Pay via Stripe.';
    return;
  }

  // 9. Initialize Stripe with the LIVE publishable key from your index.html
  const stripe = Stripe('pk_live_51TUbFqPPGSm5cT7JKBDANyRVDmi6Ytia6r31kFxAEWis6xYZuhXlDnoZ3KyB4xUoJWd3nKpzrLxuDzsQEz7X3od3006xPoLzVV');
  addCheck('Stripe initialized', 'ok', 'OK (live key)');

  // 10. Create paymentRequest
  let pr;
  try {
    pr = stripe.paymentRequest({
      country: 'AU',
      currency: 'aud',
      total: { label: 'Dr. Bike test', amount: 1000 },
      requestPayerName: true,
      requestPayerEmail: true
    });
    addCheck('stripe.paymentRequest()', 'ok', 'CREATED', 'country=AU currency=aud amount=$10.00');
  } catch (e) {
    addCheck('stripe.paymentRequest()', 'fail', 'THREW ERROR', e.message);
    return;
  }

  // 11. canMakePayment via Stripe — the key check
  document.getElementById('pr-status').textContent = 'Calling pr.canMakePayment()…';
  try {
    const result = await pr.canMakePayment();
    if (result) {
      addCheck('Stripe pr.canMakePayment()', 'ok', 'AVAILABLE', JSON.stringify(result));
      // Try to mount the button
      const elements = stripe.elements();
      const prBtn = elements.create('paymentRequestButton', {
        paymentRequest: pr,
        style: { paymentRequestButton: { type: 'default', theme: 'dark', height: '48px' } }
      });
      prBtn.mount('#pr-button');
      document.getElementById('pr-status').textContent = '✓ Button mounted — should be visible above';
      document.getElementById('conclusion').innerHTML = '✅ <strong style="color:#10B981">EVERYTHING WORKS</strong> — Apple Pay should appear in the main site. If it does not, the issue is in the integration in index.html, not in Stripe / Apple / browser.';
    } else {
      addCheck('Stripe pr.canMakePayment()', 'fail', 'returned null/false', 'Stripe says NO wallet available.');
      document.getElementById('pr-status').textContent = '✗ No wallet — button not shown';
      // Build the conclusion based on what failed earlier
      let cause = 'Unknown.';
      if (!isSafari) cause = 'You are NOT on Safari. Apple Pay only works on Safari.';
      else if (!nativeApplePay) cause = 'Browser does not expose Apple Pay API.';
      else if (nativeCanPay === false) cause = 'Apple Pay is not enabled on your device (no card in Wallet, or restricted by region/policy).';
      else if (payAllowed === false) cause = 'Permissions-Policy is blocking payment on this page.';
      else cause = 'Apple Pay API is available on the device but Stripe still says no. Likely causes: (a) the domain registered in Stripe Dashboard does not exactly match this URL, (b) the Apple Pay verification for this domain is incomplete, (c) Stripe live account restriction.';
      document.getElementById('conclusion').innerHTML = '❌ <strong style="color:#EF4444">Apple Pay NOT available.</strong><br><br><strong>Most likely cause:</strong> ' + cause;
    }
  } catch (e) {
    addCheck('Stripe pr.canMakePayment()', 'fail', 'THREW: ' + e.message);
    document.getElementById('conclusion').textContent = 'canMakePayment threw an error — see above.';
  }
})();
</script>
</body>
</html>
