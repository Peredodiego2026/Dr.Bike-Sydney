name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Also runs scripts/i18n-check.mjs: fails the build when any client-facing
      # string is missing from the Spanish or Chinese dictionary, so untranslated
      # copy cannot reach main.
      - name: Syntax + i18n coverage check
        run: npm run check

      - name: Unit tests
        run: npm test
